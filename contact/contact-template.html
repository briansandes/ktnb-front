<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* Reset styles for consistency across email clients */
        body, table, td, a {
            -webkit-text-size-adjust: 100%;
            -ms-text-size-adjust: 100%;
        }
        table, td {
            mso-table-lspace: 0pt;
            mso-table-rspace: 0pt;
        }
        img {
            -ms-interpolation-mode: bicubic;
        }
        /* Responsive adjustments */
        @media screen and (max-width: 600px) {
            .email-container {
                width: 100% !important;
            }
        }
    </style>
</head>
<body style="margin: 0; padding: 0; background-color: #f1f1f1; font-family: Arial, sans-serif;">

    <!-- Container Table -->
    <table align="center" border="0" cellpadding="0" cellspacing="0" width="100%" style="background-color: #f1f1f1; padding: 20px 0;">
        <tr>
            <td align="center">
                <!-- Inner Container -->
                <table border="0" cellpadding="0" cellspacing="0" width="600" class="email-container" style="max-width: 600px; background-color: #ffffff; border-radius: 8px;">
                    <!-- Logo Section -->
                    <tr>
                        <td align="center" style="padding: 20px 0;">
                            <img src="https://ktnb.com.br/assets/img/logo-negativo.png" alt="Logo" style="width: 120px; height: auto; border: 0;">
                        </td>
                    </tr>

                    <!-- Body Section -->
                    <tr>
                        <td style="padding: 20px; padding-bottom: 0; color: #333333; font-size: 24px; line-height: 1.5; font-weight: bold;">
                            <p style="margin: 0;">Nova mensagem de contato!</p>
                        </td>
                    </tr>

                    <!-- Body Section -->
                    <tr>
                        <td style="padding: 0px 20px; padding-top: 0; margin: 0; color: #333333; font-size: 16px; line-height: 1.5;">
                            <hr style="border: solid 2px #dedede;">
                        </td>
                    </tr>

                    <!-- Body Section -->
                    <tr>
                        <td style="padding: 20px; padding-top: 0; color: #333333; font-size: 16px; line-height: 1.5;">
                            <p>__MESSAGE_PLACEHOLDER__</p>
                        </td>
                    </tr>
                    
                    <!-- Footer Section -->
                    <tr>
                        <td align="center" style="padding: 20px; color: #666666; font-size: 12px;">
                            <p>&copy; 2024 KTNB</p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>

</body>
</html>
